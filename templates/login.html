<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — {{ app_name }}</title>
  <link rel="icon" href="{{ logo_path }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  <script defer src="{{ url_for('static', path='/js/app.js') }}"></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-card">
      <div class="login-brand"><img src="{{ logo_path }}" alt="SEU LOGO"><h1>{{ app_name }}</h1><p>Versão {{ app_version }}</p></div>
      <div class="login-heading"><h2>Entrar</h2><p>Acesse a carcaça local do sistema.</p></div>
      {% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
      <form action="/login" method="post" class="form-stack">
        <label>Usuário<input type="text" name="email" value="{{ email or 'adm' }}" autocomplete="username" required autofocus></label>
        <label>Senha<input type="password" name="password" value="adm" autocomplete="current-password" required></label>
        <button class="button button--primary" type="submit">Entrar</button>
      </form>
      <div class="local-pill"><span></span>Ambiente local e privado</div>
    </section>
  </main>
</body>
</html>
