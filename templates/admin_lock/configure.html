{% extends "layout/base.html" %}
{% block content %}<header class="page-header"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Proteger Administração</h1><p>Defina uma senha local separada para proteger esta área.</p></header>
{% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
<section class="panel section-block"><form method="post" action="/admin/cadeado/configurar"><label>Senha administrativa<input type="password" name="password" minlength="8" maxlength="256" autocomplete="new-password" required></label><label>Confirmar senha<input type="password" name="confirmation" minlength="8" maxlength="256" autocomplete="new-password" required></label><label>Expirar desbloqueio após<input type="number" name="timeout_minutes" min="1" max="480" value="{{ timeout_minutes }}" required> minutos</label><div class="form-actions"><button class="button button--primary" name="submit" value="configure" type="submit">Ativar proteção</button></div></form></section>{% endblock %}
