{% extends "layout/base.html" %}
{% block content %}<header class="page-header"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Trocar senha administrativa</h1><p>A troca revoga todos os desbloqueios administrativos existentes.</p></header>
{% if error %}<div class="alert alert--error" role="alert">{{ error }}</div>{% endif %}
<section class="panel section-block"><form method="post" action="/admin/cadeado/trocar"><label>Senha atual<input type="password" name="current_password" maxlength="256" autocomplete="current-password" required></label><label>Nova senha<input type="password" name="new_password" minlength="8" maxlength="256" autocomplete="new-password" required></label><label>Confirmar nova senha<input type="password" name="confirmation" minlength="8" maxlength="256" autocomplete="new-password" required></label><label>Expirar desbloqueio após<input type="number" name="timeout_minutes" min="1" max="480" value="{{ timeout_minutes }}" required> minutos</label><div class="form-actions"><button class="button button--primary" name="submit" value="change" type="submit">Trocar senha</button></div></form></section>{% endblock %}
