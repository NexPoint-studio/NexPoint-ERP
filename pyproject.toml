[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-template-local"
version = "1.0.0"
description = "Carcaça reutilizável de ERP local com FastAPI e pywebview"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1", "jinja2>=3.1,<4", "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20,<1", "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1", "pywebview>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
